server {
    # TLS must be terminated by the public reverse proxy before this service.
    listen 127.0.0.1:8080 default_server;
    listen [::1]:8080 default_server;
    server_name _;

    server_tokens off;
    client_max_body_size 2m;

    access_log /var/log/nginx/mcq-template.access.log;
    error_log /var/log/nginx/mcq-template.error.log;

    # Defensive blocks: the application does not intentionally serve filesystem paths.
    location ~ (^|/)\. {
        deny all;
    }
    location ~* \.(?:db|sqlite|sqlite3|bak|backup|old|orig|swp)$ {
        deny all;
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_redirect off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        # The only supported public deployment terminates HTTPS before this loopback hop.
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
